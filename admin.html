
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faizan Numbers | Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:20px 6%;background:#111722;border-bottom:1px solid #b89445;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;color:#d9b45b}
button{background:#d9b45b;color:#111;border:0;padding:11px 17px;border-radius:7px;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
.secondary{background:#293243;color:white}
.danger{background:#b83b3b;color:white}
main{max-width:1150px;margin:35px auto;padding:0 18px}
.card{background:#111722;border:1px solid #283142;border-radius:12px;padding:22px;margin-bottom:20px}
h1,h2{margin-top:0}
h2{color:#d9b45b}
input,select{width:100%;padding:13px;margin:7px 0 15px;background:#080d16;border:1px solid #394456;border-radius:7px;color:white}
label{font-size:13px;color:#c4cbd5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#182130;padding:18px;border-radius:10px}
.stat strong{display:block;font-size:27px;color:#d9b45b;margin-top:8px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{text-align:left;padding:13px;border-bottom:1px solid #293243;font-size:13px}
th{color:#d9b45b}
.tablewrap{overflow-x:auto}
.actions{display:flex;gap:7px}
.actions button{padding:8px 10px;font-size:12px}
#dashboard,#appHeader{display:none}
#message{margin:12px 0;color:#e5c16a}
#loginBox{max-width:430px;margin:70px auto}
small{color:#aeb7c5}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}header{padding:16px}}
</style>
</head>
<body>

<header>
  <div class="logo">FAIZAN NUMBERS</div>
  <button id="logoutBtn" style="display:none" onclick="logout()">Logout</button>
</header>

<main>
  <section id="loginBox" class="card">
    <h1>Admin Login</h1>
    <p><small>Sign in with your authorized admin account.</small></p>
    <label>Email Address</label>
    <input id="email" type="email" placeholder="Your admin email">
    <label>Password</label>
    <input id="password" type="password" placeholder="Your password">
    <button onclick="login()" style="width:100%">Login to Dashboard</button>
    <div id="loginMessage"></div>
  </section>

  <section id="dashboard">
    <h1>Admin Dashboard</h1>
    <p><small>Manage your phone number inventory.</small></p>

    <div class="grid">
      <div class="stat">Total Numbers<strong id="totalCount">0</strong></div>
      <div class="stat">Available<strong id="availableCount">0</strong></div>
      <div class="stat">Sold<strong id="soldCount">0</strong></div>
      <div class="stat">Other Status<strong id="otherCount">0</strong></div>
    </div>

    <div class="card" style="margin-top:22px">
      <h2 id="formTitle">Add New Number</h2>
      <form id="numberForm">
        <div class="formgrid">
          <div>
            <label>Country</label>
            <input id="country" required placeholder="USA">
          </div>
          <div>
            <label>Phone Number</label>
            <input id="phone" required placeholder="+1 202 555 0100">
          </div>
          <div>
            <label>Category</label>
            <input id="category" required placeholder="Local / Toll Free">
          </div>
          <div>
            <label>Price</label>
            <input id="price" type="number" min="0" step="0.01" required placeholder="25">
          </div>
          <div>
            <label>Status</label>
            <select id="status">
              <option value="available">Available</option>
              <option value="sold">Sold</option>
            </select>
          </div>
        </div>
        <button type="submit" id="saveBtn">Add Number</button>
        <button type="button" class="secondary" onclick="resetForm()">Cancel Edit</button>
        <div id="message"></div>
      </form>
    </div>

    <div class="card">
      <h2>Number Inventory</h2>
      <button class="secondary" onclick="loadNumbers()">Refresh Numbers</button>
      <div class="tablewrap" style="margin-top:15px">
        <table>
          <thead>
            <tr>
              <th>Country</th>
              <th>Phone Number</th>
              <th>Category</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="numberRows">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
// Your Supabase project settings
const SUPABASE_URL = "https://gusiqhkydrrvihvpsahd.supabase.co";
const SUPABASE_KEY = "sb_publishable_XUqhfy-mc7yj5Jjg4PCqsQ_Z5kexUgQ";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;
let numbers = [];

function showMessage(text, isError=false) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.color = isError ? "#ff7777" : "#e5c16a";
}

function showLoginMessage(text) {
  document.getElementById("loginMessage").textContent = text;
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showLoginMessage("Enter your email and password.");
    return;
  }

  showLoginMessage("Signing in...");

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    showLoginMessage(error.message);
    return;
  }

  await checkAdmin();
}

async function checkAdmin() {
  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    showDashboard(false);
    return;
  }

  const { data, error } = await db
    .from("site_admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !data) {
    await db.auth.signOut();
    showDashboard(false);
    showLoginMessage(error ? error.message : "This account is not an approved admin.");
    return;
  }

  showDashboard(true);
  await loadNumbers();
}

function showDashboard(isAdmin) {
  document.getElementById("loginBox").style.display = isAdmin ? "none" : "block";
  document.getElementById("dashboard").style.display = isAdmin ? "block" : "none";
  document.getElementById("logoutBtn").style.display = isAdmin ? "block" : "none";
}

async function logout() {
  await db.auth.signOut();
  showDashboard(false);
  resetForm();
}

async function loadNumbers() {
  const { data, error } = await db
    .from("phone_numbers")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    showMessage("Could not load numbers: " + error.message, true);
    return;
  }

  numbers = data || [];
  renderNumbers();
}

function renderNumbers() {
  const rows = document.getElementById("numberRows");

  document.getElementById("totalCount").textContent = numbers.length;
  document.getElementById("availableCount").textContent =
    numbers.filter(n => n.status === "available").length;
  document.getElementById("soldCount").textContent =
    numbers.filter(n => n.status === "sold").length;
  document.getElementById("otherCount").textContent =
    numbers.filter(n => !["available", "sold"].includes(n.status)).length;

  if (!numbers.length) {
    rows.innerHTML = '<tr><td colspan="6">No numbers added yet.</td></tr>';
    return;
  }

  rows.innerHTML = numbers.map(n => `
    <tr>
      <td>${safe(n.country)}</td>
      <td>${safe(n.phone_number)}</td>
      <td>${safe(n.category)}</td>
      <td>${safe(n.price)}</td>
      <td>${safe(n.status)}</td>
      <td>
        <div class="actions">
          <button onclick="editNumber('${n.id}')">Edit</button>
          <button class="danger" onclick="deleteNumber('${n.id}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

document.getElementById("numberForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const record = {
    country: document.getElementById("country").value.trim(),
    phone_number: document.getElementById("phone").value.trim(),
    category: document.getElementById("category").value.trim(),
    price: Number(document.getElementById("price").value),
    status: document.getElementById("status").value
  };

  if (!record.country || !record.phone_number || !record.category ||
      !Number.isFinite(record.price) || record.price < 0) {
    showMessage("Please enter valid details.", true);
    return;
  }

  document.getElementById("saveBtn").disabled = true;
  showMessage("Saving...");

  let result;

  if (editingId) {
    result = await db.from("phone_numbers").update(record).eq("id", editingId);
  } else {
    result = await db.from("phone_numbers").insert(record);
  }

  document.getElementById("saveBtn").disabled = false;

  if (result.error) {
    showMessage("Error: " + result.error.message, true);
    return;
  }

  showMessage(editingId ? "Number updated successfully." : "Number added successfully.");
  resetForm();
  await loadNumbers();
});

function editNumber(id) {
  const n = numbers.find(item => String(item.id) === String(id));
  if (!n) return;

  editingId = n.id;
  document.getElementById("country").value = n.country || "";
  document.getElementById("phone").value = n.phone_number || "";
  document.getElementById("category").value = n.category || "";
  document.getElementById("price").value = n.price || 0;
  document.getElementById("status").value = n.status || "available";
  document.getElementById("formTitle").textContent = "Edit Number";
  document.getElementById("saveBtn").textContent = "Update Number";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteNumber(id) {
  if (!confirm("Are you sure you want to delete this number?")) return;

  const { error } = await db.from("phone_numbers").delete().eq("id", id);

  if (error) {
    showMessage("Delete failed: " + error.message, true);
    return;
  }

  showMessage("Number deleted.");
  await loadNumbers();
}

function resetForm() {
  editingId = null;
  document.getElementById("numberForm").reset();
  document.getElementById("formTitle").textContent = "Add New Number";
  document.getElementById("saveBtn").textContent = "Add Number";
}

(async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    await checkAdmin();
  }
})();
</script>
</body>
</html>
